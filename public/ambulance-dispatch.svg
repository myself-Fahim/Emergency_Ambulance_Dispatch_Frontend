<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c0519"/>
      <stop offset="0.55" stop-color="#9f1239"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fda4af" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fda4af" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff1f2" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff1f2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="200" r="230" fill="url(#glow)"/>

  <!-- Pulse rings around the emergency location -->
  <circle cx="300" cy="290" r="40" fill="none" stroke="#fff1f2" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="300" cy="290" r="75" fill="none" stroke="#fff1f2" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="300" cy="290" r="115" fill="none" stroke="#fff1f2" stroke-opacity="0.15" stroke-width="2"/>

  <!-- City skyline -->
  <g fill="#fff1f2" fill-opacity="0.09">
    <rect x="0" y="470" width="70" height="217"/>
    <rect x="60" y="410" width="60" height="277"/>
    <rect x="130" y="500" width="50" height="187"/>
    <rect x="420" y="440" width="60" height="247"/>
    <rect x="470" y="380" width="70" height="307"/>
    <rect x="535" y="480" width="65" height="207"/>
  </g>
  <!-- Windows -->
  <g fill="#fecdd3" fill-opacity="0.45">
    <rect x="14" y="490" width="8" height="8"/><rect x="34" y="490" width="8" height="8"/>
    <rect x="14" y="520" width="8" height="8"/><rect x="44" y="550" width="8" height="8"/>
    <rect x="74" y="430" width="8" height="8"/><rect x="94" y="430" width="8" height="8"/>
    <rect x="74" y="465" width="8" height="8"/><rect x="94" y="500" width="8" height="8"/>
    <rect x="74" y="540" width="8" height="8"/><rect x="142" y="520" width="8" height="8"/>
    <rect x="432" y="460" width="8" height="8"/><rect x="452" y="500" width="8" height="8"/>
    <rect x="486" y="400" width="8" height="8"/><rect x="510" y="400" width="8" height="8"/>
    <rect x="486" y="440" width="8" height="8"/><rect x="510" y="480" width="8" height="8"/>
    <rect x="486" y="530" width="8" height="8"/><rect x="550" y="500" width="8" height="8"/>
  </g>

  <!-- Emergency location pin -->
  <path d="M300 345 C300 345 248 290 248 255 a52 52 0 1 1 104 0 C352 290 300 345 300 345 Z" fill="#fff1f2"/>
  <circle cx="300" cy="255" r="34" fill="#be123c"/>
  <rect x="294" y="237" width="12" height="36" rx="2" fill="#fff1f2"/>
  <rect x="282" y="249" width="36" height="12" rx="2" fill="#fff1f2"/>

  <!-- Dispatch route -->
  <path d="M300 350 C300 440 245 460 245 535" fill="none" stroke="#fff1f2" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 14"/>

  <!-- Road -->
  <rect x="0" y="687" width="600" height="113" fill="#3b0413"/>
  <rect x="0" y="687" width="600" height="4" fill="#fff1f2" fill-opacity="0.25"/>
  <g fill="#fff1f2" fill-opacity="0.45">
    <rect x="20" y="745" width="70" height="8" rx="4"/>
    <rect x="150" y="745" width="70" height="8" rx="4"/>
    <rect x="280" y="745" width="70" height="8" rx="4"/>
    <rect x="410" y="745" width="70" height="8" rx="4"/>
    <rect x="540" y="745" width="70" height="8" rx="4"/>
  </g>

  <!-- Headlight beam -->
  <polygon points="452,640 600,600 600,690 452,665" fill="url(#beam)"/>

  <!-- Siren glow -->
  <circle cx="245" cy="548" r="60" fill="#fb7185" fill-opacity="0.35"/>
  <circle cx="245" cy="548" r="32" fill="#fda4af" fill-opacity="0.5"/>

  <!-- Ambulance body -->
  <rect x="130" y="560" width="235" height="108" rx="10" fill="#fff1f2"/>
  <path d="M365 590 L415 590 Q432 590 440 606 L455 640 Q458 648 458 656 L458 668 L365 668 Z" fill="#fff1f2"/>
  <!-- Cab window -->
  <path d="M378 600 L412 600 Q422 600 427 610 L438 635 L378 635 Z" fill="#9f1239" fill-opacity="0.75"/>
  <!-- Stripe -->
  <rect x="130" y="625" width="328" height="12" fill="#e11d48"/>
  <!-- Cross emblem -->
  <rect x="237" y="578" width="16" height="42" rx="3" fill="#e11d48"/>
  <rect x="224" y="591" width="42" height="16" rx="3" fill="#e11d48"/>
  <!-- Rear door line -->
  <line x1="150" y1="568" x2="150" y2="660" stroke="#9f1239" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Siren lights on roof -->
  <rect x="215" y="540" width="60" height="20" rx="6" fill="#e11d48"/>
  <rect x="222" y="544" width="20" height="12" rx="3" fill="#fda4af"/>
  <rect x="248" y="544" width="20" height="12" rx="3" fill="#fecdd3"/>
  <!-- Headlight and bumper -->
  <circle cx="450" cy="648" r="6" fill="#fef3c7"/>
  <rect x="125" y="660" width="338" height="10" rx="4" fill="#9f1239"/>

  <!-- Wheels -->
  <g>
    <circle cx="200" cy="672" r="24" fill="#1f0209"/>
    <circle cx="200" cy="672" r="10" fill="#fff1f2"/>
    <circle cx="200" cy="672" r="4" fill="#9f1239"/>
    <circle cx="405" cy="672" r="24" fill="#1f0209"/>
    <circle cx="405" cy="672" r="10" fill="#fff1f2"/>
    <circle cx="405" cy="672" r="4" fill="#9f1239"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
